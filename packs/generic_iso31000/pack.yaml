# =====================================================================
#  Domain pack: Generic ISO 31000 risk review (minimal placeholder)
#
#  A deliberately simple pack that proves the engine is pack-agnostic:
#  it contains configuration and prompts only, and runs with no change to
#  the engine code. Use it as a template for new domains (HSE, political,
#  operational, company, financial).
# =====================================================================

name: generic_iso31000
title: General risk review (ISO 31000)
version: "0.1"
description: >
  Reviews any set of documents (a plan, proposal, policy or agreement) and
  identifies the risks, threats and opportunities, to the stated objectives.

perspective: the organisation that wrote or will rely on the documents
objectives:
  - Achieve the objectives stated in the documents
  - Stay within the budget and timescale
  - Meet legal and regulatory obligations
  - Protect people, reputation and assets

impact_basis:
  measure: share of the value at risk
  base_value_label: Value at risk
  currency: GBP

accepted_file_types: [".pdf", ".docx", ".xlsx", ".xlsm", ".txt", ".md", ".csv"]

ingest:
  extra_heading_patterns: []

taxonomy:
  - code: STR
    category: Strategic
    typical: Objectives, market, competition, dependencies on other plans
  - code: OPS
    category: Operational
    typical: Processes, capacity, delivery, suppliers
  - code: FIN
    category: Financial
    typical: Budget, funding, cashflow, prices, currency
  - code: CMP
    category: Legal and compliance
    typical: Contracts, regulation, permits, data protection
  - code: HSE
    category: Health, safety and environment
    typical: Harm to people, environmental damage
  - code: PEO
    category: People
    typical: Skills, key people, capacity, culture
  - code: TEC
    category: Technology and information
    typical: Systems, cyber security, data
  - code: REP
    category: Reputation and stakeholders
    typical: Public, customers, partners, regulators
  - code: EXT
    category: External
    typical: Economy, politics, weather, events beyond control

likelihood_scale:
  - {score: 1, label: Rare, band: under 5%, midpoint: 0.03}
  - {score: 2, label: Unlikely, band: 5 to 15%, midpoint: 0.10}
  - {score: 3, label: Possible, band: 15 to 35%, midpoint: 0.25}
  - {score: 4, label: Likely, band: 35 to 60%, midpoint: 0.45}
  - {score: 5, label: Almost certain, band: over 60%, midpoint: 0.75}

impact_scale:
  - {score: 1, label: Minor, band: under 0.5%, upper_pct: 0.5}
  - {score: 2, label: Moderate, band: 0.5 to 1%, upper_pct: 1.0}
  - {score: 3, label: Significant, band: 1 to 3%, upper_pct: 3.0}
  - {score: 4, label: Major, band: 3 to 7%, upper_pct: 7.0}
  - {score: 5, label: Severe, band: over 7%, upper_pct: null}

rating:
  red_min: 15
  amber_min: 8
  colours: {red: "FF4B4B", amber: "FFC000", green: "70AD47"}
  always_red_flags: [unlimited_exposure]

responses: [avoid, reduce, share, accept, exploit, clarify]

opportunity:
  cheap_mitigation_ratio: 3
  asymmetry_ratio: 3

decision:
  title: Overall view
  options:
    - id: proceed
      label: Proceed
    - id: conditional
      label: Proceed, with the conditions listed
    - id: decline
      label: Do not proceed as planned
  indicator_rules:
    - option: decline
      if_any:
        p80_pct_at_least: 20
    - option: conditional
      if_any:
        red_count_at_least: 1
        flag_present: [unlimited_exposure]
  default: proceed

report:
  title: Risk review
  base_value_label: Value at risk
  footer: "Automated risk screening for review by a competent person. Not legal advice."
  clarifications_heading: Questions to resolve
  qualifications_heading: Conditions to attach
  actions_heading: Recommended actions
  method_notes:
    - "This is a general-purpose pack following ISO 31000 (risk is the effect of uncertainty on objectives). It is a minimal placeholder; specialist packs give better results in their own domains."

files:
  extract_prompt: extract_prompt.md
  synth_prompt: synth_prompt.md
  opportunity_prompt: opportunity_prompt.md
  examples: examples.json
  checklist: checklist.yaml
