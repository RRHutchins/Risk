# =====================================================================
#  Domain pack: Construction tender
#
#  Everything specific to construction tenders lives in this folder.
#  The engine reads it; nothing here is built into the engine code.
#  Edit these values to change categories, scales, or thresholds.
# =====================================================================

name: construction_tender
title: Construction tender risk review
version: "0.1"
description: >
  Reviews a UK construction tender pack from the bidder's side and
  identifies threats and opportunities the bidder would take on.

# Who the risks are assessed for, and against what.
perspective: the bidding contractor or subcontractor
objectives:
  - Deliver the works profitably at the tendered price
  - Complete on time without delay damages
  - Maintain healthy cashflow
  - Avoid uncapped or uninsurable liabilities

# How impacts are expressed. The user enters the base value at run time.
impact_basis:
  measure: share of contract value
  base_value_label: Contract value
  currency: GBP

# File types this pack expects to receive.
accepted_file_types: [".pdf", ".docx", ".xlsx", ".xlsm", ".txt", ".md", ".csv"]

# Extra clause headings to recognise when splitting documents, on top of the
# engine's general ones (numbered clauses like "4.2", and "Clause", "Section",
# "Schedule", "Appendix" and similar). Each is a pattern matching the clause
# label at the start of a line.
ingest:
  extra_heading_patterns:
    - '[ZXY]\d{1,2}(?:\.\d{1,3})*(?=\s|$)'     # NEC option clauses: Z1, X7, Y2.3
    - '(?:Option|OPTION)\s+[A-Z]\d{0,2}(?=[\s:.]|$)'      # "Option Z", "Option X7"
    - '(?:Amendment|AMENDMENT)\s+\d{1,3}(?=[\s:.]|$)'    # "Amendment 14"

# ---------------------------------------------------------------------
#  Taxonomy (risk categories)
# ---------------------------------------------------------------------
taxonomy:
  - code: LIA
    category: Liability and indemnity
    typical: Uncapped liability, wide indemnities, consequential loss
  - code: LAD
    category: Delay damages
    typical: Liquidated damages rate, cap, sectional completion
  - code: PAY
    category: Payment and cashflow
    typical: Payment period, retention, pay-less mechanics, set-off
  - code: TIM
    category: Programme and time
    typical: Completion dates, time bars, notice periods, float ownership
  - code: DES
    category: Design responsibility
    typical: Fitness for purpose, design liability, novation of designers
  - code: GRD
    category: Ground and site
    typical: Unforeseen conditions, surveys relied on, access, existing services
  - code: SCO
    category: Scope and specification
    typical: Ambiguity, gaps, conflicts between documents
  - code: VAR
    category: Change and variations
    typical: Valuation rules, instruction process, omitted work
  - code: TER
    category: Termination
    typical: Convenience termination, step-in, compensation on termination
  - code: INS
    category: Insurance and security
    typical: Bonds, parent company guarantee, insurance levels
  - code: PRI
    category: Price risk
    typical: Fixed price, inflation, provisional sums, currency
  - code: SUB
    category: Supply chain
    typical: Flow-down gaps, nominated subcontractors, long-lead items
  - code: HSE
    category: Health, safety, environment
    typical: CDM duties, hazardous materials, environmental constraints
  - code: CON
    category: Consents and third parties
    typical: Planning, permits, neighbours, utilities
  - code: EMP
    category: Employer
    typical: Ability to pay, decision-making, track record
  - code: TEN
    category: Tender process
    typical: Time to bid, clarification limits, evaluation criteria

# ---------------------------------------------------------------------
#  Likelihood scale
#  "midpoint" is the probability used in the simulation.
#  These are starting defaults, not industry standards.
# ---------------------------------------------------------------------
likelihood_scale:
  - score: 1
    label: Rare
    band: under 5%
    midpoint: 0.03
  - score: 2
    label: Unlikely
    band: 5 to 15%
    midpoint: 0.10
  - score: 3
    label: Possible
    band: 15 to 35%
    midpoint: 0.25
  - score: 4
    label: Likely
    band: 35 to 60%
    midpoint: 0.45
  - score: 5
    label: Almost certain
    band: over 60%
    midpoint: 0.75

# ---------------------------------------------------------------------
#  Impact scale (as a percentage of contract value)
#  "upper_pct" is the top of each band; the last band has no top.
# ---------------------------------------------------------------------
impact_scale:
  - score: 1
    label: Minor
    band: under 0.5%
    upper_pct: 0.5
  - score: 2
    label: Moderate
    band: 0.5 to 1%
    upper_pct: 1.0
  - score: 3
    label: Significant
    band: 1 to 3%
    upper_pct: 3.0
  - score: 4
    label: Major
    band: 3 to 7%
    upper_pct: 7.0
  - score: 5
    label: Severe
    band: over 7%
    upper_pct: null

# ---------------------------------------------------------------------
#  Rating: score = likelihood x impact
# ---------------------------------------------------------------------
rating:
  red_min: 15      # 15 and above is red
  amber_min: 8     # 8 to 14 is amber; below 8 is green
  colours:
    red: "FF4B4B"
    amber: "FFC000"
    green: "70AD47"
  # Findings carrying any of these flags are red whatever their score.
  always_red_flags:
    - uncapped_liability
    - uncapped_delay_damages

# Allowed responses to a risk.
responses: [qualify, price, insure, transfer, clarify, accept, decline]

# ---------------------------------------------------------------------
#  Standard forms: recognised by name only. The copyrighted text of
#  these forms is never stored here. Review concentrates on amendments.
# ---------------------------------------------------------------------
standard_forms:
  - name: NEC4
    amendment_markers: ["Z clause", "Option Z", "Z1", "Z2", "Z3"]
  - name: NEC3
    amendment_markers: ["Z clause", "Option Z"]
  - name: JCT
    amendment_markers: ["Schedule of Amendments", "amendments to the JCT"]
  - name: FIDIC
    amendment_markers: ["Particular Conditions", "Part B"]
  - name: ICC
    amendment_markers: ["Schedule of Amendments"]

# ---------------------------------------------------------------------
#  Opportunity finder (Stage 6)
# ---------------------------------------------------------------------
opportunity:
  # A mitigation is "cheap" when the expected loss it removes is at least
  # this many times its cost.
  cheap_mitigation_ratio: 3
  # An opportunity is an "asymmetry" when its upside is at least this many
  # times its downside.
  asymmetry_ratio: 3

# ---------------------------------------------------------------------
#  Decision summary (Stage 6)
#  The software works out an indicator from these rules (checked from the
#  top; the first that matches wins). Claude writes the reasoning; if its
#  view differs from the indicator, the report says so.
#  Measures you can use: p80_pct_at_least, p50_pct_at_least,
#  red_count_at_least, amber_count_at_least, flag_present (a list),
#  checklist_not_found_at_least.
# ---------------------------------------------------------------------
decision:
  title: Bid / no-bid view
  options:
    - id: proceed
      label: Bid
    - id: conditional
      label: Bid, with qualifications and clarifications
    - id: decline
      label: Do not bid
  indicator_rules:
    - option: decline
      if_any:
        p80_pct_at_least: 15
        red_count_at_least: 8
    - option: conditional
      if_any:
        red_count_at_least: 1
        flag_present: [uncapped_liability, uncapped_delay_damages]
        p80_pct_at_least: 5
  default: proceed

# ---------------------------------------------------------------------
#  Report wording
# ---------------------------------------------------------------------
report:
  title: Tender risk review
  base_value_label: Contract value
  footer: "Automated risk screening for review by a competent person. Not legal advice."
  clarifications_heading: Clarification questions for the employer
  qualifications_heading: Suggested tender qualifications
  actions_heading: Actions before submitting the tender
  method_notes:
    - "Findings come from the tender documents only. The software has no knowledge of the bidder's own costs, programme or appetite for risk; impact ranges are typical values for work of this kind and should be replaced with the bidder's own estimates where available."
    - "Where the documents use a standard form (NEC, JCT, FIDIC and similar), the review concentrates on the amendments. Unamended standard-form terms are not reviewed clause by clause."
    - "The review does not give a legal opinion on whether any term is enforceable."

# Files the engine reads from this folder.
files:
  extract_prompt: extract_prompt.md
  synth_prompt: synth_prompt.md
  opportunity_prompt: opportunity_prompt.md
  examples: examples.json
  checklist: checklist.yaml
